# Single writer: keep one Machine attached to this SQLite volume.
app = "walnuts-roasting"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ORIGIN = "https://walnuts-roasting.fly.dev"
  COOKIE_SECURE = "1"
  DATABASE_PATH = "/data/production.sqlite"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "walnuts_data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/session"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
